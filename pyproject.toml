[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixrel"
version = "0.1.0"
description = "Research implementation of pixel relationship learning"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "matplotlib>=3.7", "Pillow>=9.0"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]

[project.scripts]
pixrel-train = "pixrel.cli:train_main"
pixrel-evaluate = "pixrel.cli:eval_main"
pixrel-pretrain = "pixrel.pretraining.trainer:pretrain_main"
pixrel-transfer = "pixrel.transfer:train_main"
pixrel-transfer-evaluate = "pixrel.transfer:evaluate_main"
pixrel-hub-upload = "pixrel.hub:upload_main"

[tool.setuptools.packages.find]
include = ["pixrel*"]
