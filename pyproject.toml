[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixrel"
version = "0.1.0"
description = "Research implementation of pixel relationship learning"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24"]

[project.scripts]
pixrel-train = "pixrel.cli:train_main"
pixrel-evaluate = "pixrel.cli:eval_main"

[tool.setuptools.packages.find]
include = ["pixrel*"]
